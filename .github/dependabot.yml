# Monthly, grouped dependency updates: one PR for npm packages and one for GitHub Actions.
# They go through the same quality checks as any other pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, skip-changelog]
    ignore:
      # Prisma 7 is a migration (prisma.config.ts, a driver adapter, client and CLI together),
      # not a bump; do it by hand on its own branch. Minor and patch updates still come through.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, skip-changelog]
